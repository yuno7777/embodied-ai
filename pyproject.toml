[project]
name = "embodied-worlds"
version = "0.1.0"
description = "Deterministic embodied-agent simulation and benchmarking platform"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.0", "httpx>=0.27", "typer>=0.12", "rich>=13", "tenacity>=8", "pandas>=2", "pyarrow>=15", "google-genai>=1"]

[project.scripts]
embodied-ai = "embodied_ai.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

