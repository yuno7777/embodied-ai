<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Embodied Worlds</title><link rel="stylesheet" href="style.css"></head><body>
<header><div><span class="eyebrow">RESEARCH SANDBOX / V1</span><h1>Embodied Worlds</h1></div><button id="newRun">Start simulation</button></header>
<main><section class="map-panel"><div class="section-label">Researcher view · authoritative map</div><div id="map" aria-label="simulation map"></div><div class="legend"><i class="agent"></i> agent <i class="item"></i> resource <i class="hazard"></i> hazard <i class="door"></i> exit</div></section>
<aside><div class="card"><span class="section-label">Live run</span><h2 id="status">Waiting to begin</h2><div class="metrics"><p>STEP <b id="step">0</b></p><p>HEALTH <b id="health">100</b></p><p>ENERGY <b id="energy">100</b></p><p>HYDRATION <b id="hydration">100</b></p></div></div><div class="card"><span class="section-label">Agent observation</span><p id="goal">Start a run to place an agent into the room.</p></div><div class="card"><span class="section-label">Events</span><ol id="events"></ol></div><div class="card controls"><button data-a='{"type":"move","direction":"north"}'>↑</button><div><button data-a='{"type":"move","direction":"west"}'>←</button><button data-a='{"type":"move","direction":"south"}'>↓</button><button data-a='{"type":"move","direction":"east"}'>→</button></div><button data-a='{"type":"pickup"}'>Pick up</button><button data-a='{"type":"open","target_id":"exit_door"}'>Open exit</button></div></aside></main><script src="app.js"></script></body></html>
